<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rocket Sales Agent — grant microphone</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 24px; color: #0f172a; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      p { font-size: 14px; line-height: 1.5; color: #475569; }
      button { background: #10b981; color: white; border: 0; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
      button:disabled { background: #cbd5e1; cursor: not-allowed; }
      .ok { color: #059669; font-weight: 600; }
      .err { color: #dc2626; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Grant Rocket microphone access</h1>
    <p>Rocket listens to your Google Meet calls so it can suggest answers in real time. We need your microphone to capture your voice in addition to the customer's audio. You only need to grant this once.</p>
    <button id="grant">Allow microphone</button>
    <p id="status"></p>
    <script type="module" src="./index.js"></script>
  </body>
</html>
