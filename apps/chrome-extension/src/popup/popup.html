<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rocket Sales Agent</title>
    <style>
      /* Liquid glass language — same tokens as the in-call overlay
         (apps/chrome-extension/src/content/index.ts). VisionOS-style
         translucent panels over a near-black gradient ground. */
      :root {
        color-scheme: dark;
        --fg: #F8FAFC;
        --muted: rgba(248, 250, 252, 0.72);
        --dim: rgba(248, 250, 252, 0.55);
        --accent: #34D399;
        --accent-soft: rgba(52, 211, 153, 0.18);
        --glass-bg: rgba(17, 24, 39, 0.42);
        --glass-blur: blur(28px) saturate(160%);
        --glass-border: 1px solid rgba(255, 255, 255, 0.14);
        --glass-shadow:
          0 12px 40px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        --radius: 16px;
        --radius-sm: 12px;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        color: var(--fg);
        font: 13px/1.45 'Inter', -apple-system, system-ui, BlinkMacSystemFont, sans-serif;
        letter-spacing: 0.1px;
      }
      body {
        width: 340px;
        padding: 16px;
        /* Atmospheric backdrop so the glass panels have something to blur. */
        background:
          radial-gradient(120% 80% at 0% 0%, rgba(52, 211, 153, 0.15), transparent 60%),
          radial-gradient(120% 80% at 100% 100%, rgba(96, 165, 250, 0.12), transparent 60%),
          linear-gradient(160deg, #0B0F17 0%, #050709 100%);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .muted { color: var(--muted); }
      .row { display: flex; gap: 8px; align-items: center; }
      .pill {
        display: inline-flex; align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid rgba(52, 211, 153, 0.32);
      }
      button, .btn {
        appearance: none;
        background: var(--accent);
        color: #052E1F;
        border: 0;
        border-radius: 10px;
        padding: 8px 12px;
        font: 600 12px 'Inter', -apple-system, system-ui, sans-serif;
        letter-spacing: 0.2px;
        cursor: pointer;
        text-decoration: none;
        text-shadow: none;
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        box-shadow: 0 4px 16px rgba(52, 211, 153, 0.25);
      }
      button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(52, 211, 153, 0.32); }
      button:active, .btn:active { transform: translateY(0); }
      button:disabled, .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--fg);
        box-shadow: none;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.06);
        box-shadow: none;
      }
      .card {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--glass-border);
        border-radius: var(--radius);
        padding: 14px;
        margin-top: 10px;
        box-shadow: var(--glass-shadow);
      }
      .card .card { /* nested sub-card on the same card surface — flatten */
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: none;
      }
      input[type="text"], input[type="email"], input[type="password"] {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--fg);
        border-radius: 10px;
        padding: 8px 10px;
        font: 12px 'Inter', system-ui, sans-serif;
        outline: none;
        width: 100%;
        transition: border-color 150ms ease, background 150ms ease;
      }
      input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
        border-color: rgba(52, 211, 153, 0.6);
        background: rgba(255, 255, 255, 0.08);
      }
      label { color: var(--muted); font-size: 11px; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo;
        font-size: 11px;
        color: var(--muted);
      }
      .stack { display: flex; flex-direction: column; gap: 8px; }
      hr {
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin: 8px 0;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Rocket Sales Agent</h1>
    <p class="muted" style="margin: 0 0 8px;">
      Detects Google Meet sessions and pairs them with the overlay.
    </p>
    <div id="root"></div>
    <script type="module" src="popup/index.js"></script>
  </body>
</html>
